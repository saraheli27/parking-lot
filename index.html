<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parking Lot</title>
<style>
  :root {
    --bg: #f3f9fb;
    --card: #ffffff;
    --ink: #104911;          /* Black Forest */
    --muted: #4c6a4d;
    --line: #d4e7ed;
    --accent: #104911;
    --green: #548c2f;        /* Forest Green */
    --blue: #a8d5e2;         /* Light Blue */
    --orange: #f9a620;       /* Orange */
    --mustard: #ffd449;      /* Mustard */
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 var(--font);
  }
  .stripe { display: flex; height: 6px; }
  .stripe span { flex: 1; }
  main { max-width: 680px; margin: 0 auto; padding: 44px 20px 80px; }
  h1 { font-size: 2rem; font-weight: 700; margin: 0 0 2px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; }

  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    display: grid;
    gap: 10px;
    grid-template-columns: 1fr 160px;
  }
  form textarea { grid-column: 1 / -1; }
  input, select, textarea, button { font: inherit; font-size: 0.95rem; }
  input, select, textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  textarea { resize: vertical; min-height: 44px; }
  input:focus, select:focus, textarea:focus { outline: 3px solid var(--mustard); outline-offset: 0; border-color: var(--green); }
  button.add {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 9px 22px;
    font-weight: 600;
    cursor: pointer;
  }
  button.add:hover { background: #1d5e1f; }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 28px 0 12px; }
  .chip {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--green); color: var(--ink); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  ul { list-style: none; padding: 0; margin: 0; }
  li {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--tag, var(--blue));
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  li.done { opacity: 0.55; }
  li.done .text { text-decoration: line-through; }
  .body { flex: 1; min-width: 0; }
  .text { margin: 0; font-weight: 500; word-wrap: break-word; }
  .note { margin: 4px 0 0; color: var(--muted); font-size: 0.92rem; white-space: pre-wrap; }
  .meta { margin-top: 6px; font-size: 0.78rem; color: var(--muted); }
  .tag {
    display: inline-block;
    background: var(--tag, var(--blue));
    color: var(--ink);
    font-weight: 600;
    border-radius: 4px;
    padding: 1px 8px;
    margin-right: 6px;
  }
  select.tag {
    width: auto;
    border: 0;
    font: inherit;
    font-weight: 600;
    padding: 1px 20px 1px 8px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: right 9px center, right 5px center;
    background-size: 4px 4px;
    background-repeat: no-repeat;
    background-color: var(--tag, var(--blue));
  }
  select.tag:focus { outline: 2px solid var(--mustard); }
  /* One bright color per tag; text stays dark for legibility */
  .t-idea      { --tag: var(--mustard); }
  .t-someday   { --tag: var(--blue); }
  .t-read      { --tag: #fcd08a; }
  .t-home      { --tag: #cfe5bf; }
  .t-follow    { --tag: var(--orange); }

  .actions { display: flex; gap: 4px; }
  .actions button {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .actions button:hover { color: var(--ink); border-color: var(--green); }
  .form-row { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 12px; }
  .form-row .add { align-self: flex-end; }
  .check { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 0.9rem; cursor: pointer; }
  .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--green); }
  .repeat { color: var(--ink); font-weight: 600; }
  .actions button.on { background: var(--blue); border-color: var(--blue); color: var(--ink); }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }

  @media (max-width: 520px) {
    form { grid-template-columns: 1fr; }
    .form-row .add { align-self: stretch; }
    li { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"><span style="background:#a8d5e2"></span><span style="background:#f9a620"></span><span style="background:#ffd449"></span><span style="background:#548c2f"></span><span style="background:#104911"></span></div>
<main>
  <h1>Parking Lot</h1>
  <p class="sub">Noted, not now.</p>

  <form id="add-form">
    <input id="text" placeholder="What are you parking?" required autocomplete="off">
    <select id="tag">
      <option>Idea</option>
      <option>Someday</option>
      <option>Read / Watch</option>
      <option>Home</option>
      <option>Follow up</option>
    </select>
    <textarea id="note" placeholder="Optional note — why it matters, when to revisit"></textarea>
    <div class="form-row">
      <label class="check"><input type="checkbox" id="recurring"> Recurring — log it done but keep it parked</label>
      <button class="add" type="submit">Park it</button>
    </div>
  </form>

  <div class="filters" id="filters"></div>
  <ul id="list"></ul>
</main>

<script>
  const KEY = "parking-lot-items";
  let items = load();
  let filter = "All";
  const TAG_CLASS = { "Idea": "t-idea", "Someday": "t-someday", "Read / Watch": "t-read", "Home": "t-home", "Follow up": "t-follow" };

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY)) || [];
      // Rename tags saved under the old label
      saved.forEach(i => { if (i.tag === "Read / watch") i.tag = "Read / Watch"; });
      return saved;
    }
    catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }

  function repeatInfo(i) {
    if (!i.recurring) return "";
    const n = (i.log || []).length;
    if (!n) return ' · <span class="repeat">Recurring</span>';
    const last = new Date(i.log[n - 1]).toLocaleDateString();
    return ` · <span class="repeat">Done ${n}× · last ${last}</span>`;
  }

  function render() {
    const tags = ["All", ...new Set(items.filter(i => !i.done).map(i => i.tag)), "Done"];
    const filters = document.getElementById("filters");
    filters.innerHTML = "";
    tags.forEach(t => {
      const b = document.createElement("button");
      b.className = "chip" + (t === filter ? " on" : "");
      b.textContent = t;
      b.onclick = () => { filter = t; render(); };
      filters.appendChild(b);
    });

    let shown = items.filter(i =>
      filter === "Done" ? i.done :
      filter === "All" ? !i.done :
      i.tag === filter && !i.done
    );
    shown.sort((a, b) => b.created - a.created);

    const list = document.getElementById("list");
    list.innerHTML = "";
    if (!shown.length) {
      list.innerHTML = '<p class="empty">Nothing parked here.</p>';
      return;
    }
    shown.forEach(i => {
      const li = document.createElement("li");
      li.className = (TAG_CLASS[i.tag] || "") + (i.done ? " done" : "");
      li.innerHTML = `
        <div class="body">
          <p class="text"></p>
          ${i.note ? '<p class="note"></p>' : ""}
          <div class="meta"><select class="tag" aria-label="Change category"></select>${new Date(i.created).toLocaleDateString()}${repeatInfo(i)}</div>
        </div>
        <div class="actions">
          <button data-act="toggle">${i.done ? "Restore" : i.recurring ? "Log done" : "Done"}</button>
          ${i.done ? "" : `<button data-act="repeat" class="${i.recurring ? "on" : ""}" title="Recurring on/off">Recurring</button>`}
          <button data-act="delete">Delete</button>
        </div>`;
      li.querySelector(".text").textContent = i.text;
      if (i.note) li.querySelector(".note").textContent = i.note;
      const tagSel = li.querySelector(".tag");
      const tagNames = [...document.querySelectorAll("#tag option")].map(o => o.value);
      if (!tagNames.includes(i.tag)) tagNames.push(i.tag);
      tagNames.forEach(t => tagSel.add(new Option(t, t, false, t === i.tag)));
      tagSel.onchange = () => { i.tag = tagSel.value; save(); render(); };
      li.querySelector('[data-act="toggle"]').onclick = () => {
        if (i.recurring && !i.done) {
          (i.log = i.log || []).push(Date.now());   // log it, keep it parked
        } else {
          i.done = !i.done;
        }
        save(); render();
      };
      const rb = li.querySelector('[data-act="repeat"]');
      if (rb) rb.onclick = () => { i.recurring = !i.recurring; save(); render(); };
      li.querySelector('[data-act="delete"]').onclick = () => {
        items = items.filter(x => x.id !== i.id); save(); render();
      };
      list.appendChild(li);
    });
  }

  document.getElementById("add-form").addEventListener("submit", e => {
    e.preventDefault();
    const text = document.getElementById("text").value.trim();
    if (!text) return;
    items.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      text,
      note: document.getElementById("note").value.trim(),
      tag: document.getElementById("tag").value,
      created: Date.now(),
      done: false,
      recurring: document.getElementById("recurring").checked,
      log: []
    });
    save();
    e.target.reset();
    document.getElementById("text").focus();
    render();
  });

  render();
</script>
</body>
</html>
